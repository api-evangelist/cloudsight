  npm registry on 2026-08-09.
description: >-
  CloudSight names five first-party client libraries in its own API
  documentation, all published under the github.com/cloudsight organization.
  Four are on a public package registry; the Go client is consumed directly as
  a Go module. A sixth package, `cloudsight` on npm, was UNPUBLISHED by its
  owner on 2025-10-15 and is no longer installable.
