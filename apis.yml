description: >-
  CloudSight Inc. is a computer-vision company that sells general-purpose image
  understanding as a single, simple REST API. A client POSTs an image — as a
  multipart upload, a base64 data URI, or a remote image URL — and receives a
  token; polling that token returns a natural-language caption describing what
  is in the picture, together with skip reasons (blurry, dark, bright,
  offensive, unsure) and content flags (adult) when the image cannot be
  described. The company grew out of the CamFind visual-search app, also ships
  an on-device SDK, and lists a whole-scene recognition model on Google Cloud
  Marketplace. The public API contract is published as an API Blueprint on
  Apiary and is backed by first-party client libraries for Ruby, Python, Go,
  Elixir and Objective-C.
